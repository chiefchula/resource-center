{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2 class="mb-0">Categories</h2>
    <a href="{{ url_for('admin.new_category') }}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> New Category</a>
</div>
<div class="card"><div class="card-body p-0">
    <table class="table mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Description</th></tr></thead>
        <tbody>
            {% for c in categories %}
            <tr><td>{{ c.name }}</td><td>{{ c.description or '—' }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div></div>
{% endblock %}
